<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My webpage</title>
    <meta charset=utf-8>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is my GitHub Pages site showcasing my certificates and information on how to contact me.">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/css-doodle@0.17.2/css-doodle.min.js"></script>
  </head>
  <body>
    <header>
        <div class="navigation">
          <div class="nav_button home"><button data-page="home" class="but">Home</button></div>
          <div class="nav_button socials"><button data-page="socials" class="but">Socials</button></div>
          <div class="nav_button portfolio"><button data-page="portfolio" class="but">Portfolio</button></div>
          <div class="nav_button portfolio"><button data-page="map" class="but">Map</button></div>
        </div>
        <div id="greetings">
          <p class="content">Hello, world!</p>   
        </div>
    </header>
    <main>
      <div class="none" id="home">
        <css-doodle>
          <style>
            @grid: 50x1 / 50vmin;
            :container {
              perspective: 23vmin;
            }
            background: @m(
              @r(200, 240), 
              radial-gradient(
                @p(#00b8a9, #f8f3d4, #f6416c, #ffde7d) 15%,
                transparent 50%
              ) @r(100%) @r(100%) / @r(1%, 3%) @lr no-repeat
            );
        
            @size: 80%;
            @place-cell: center;
        
            border-radius: 50%;
            transform-style: preserve-3d;
            animation: scale-up 20s linear infinite;
            animation-delay: calc(@i * -.4s);
        
            @keyframes scale-up {
              0% {
                opacity: 0;
                transform: translate3d(0, 0, 0) rotate(0);
              }
              10% { 
                opacity: 1; 
              }
              95% {
                transform:
                  translate3d(0, 0, @r(50vmin, 55vmin))
                  rotate(@r(-360deg, 360deg));
              }
              100% {
                opacity: 0;
                transform: translate3d(0, 0, 1vmin);
              }
            }
          </style>
        </css-doodle>
      </div>
      <div class="none" id="socials">
          <a href="https://www.linkedin.com/in/tyuris"><i class="fa fa-linkedin-square" aria-hidden="true" style="color: black; font-size: 85px;"></i></a>
          <a href="https://t.me/aint_got_no_mercy"><i class="fa fa-telegram" aria-hidden="true" style="color: black; font-size: 85px;" ></i></a>
          <a href="https://github.com/Tyuris-creator"><i class="fa fa-github" aria-hidden="true" style="color: black; font-size: 85px;"></i></a>
      </div>
      <div class="none" id="map" style="text-align: center;">
        <a href="https://myworldmap.ru/user/34248/"><img id="adv" style="border-radius: 25px;" src="https://myworldmap.ru/map.php?user=34248&x=800&y=450&lang=en&v=" width="800" height="450"></a>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
